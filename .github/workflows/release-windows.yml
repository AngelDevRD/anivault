name: Release Windows

# Reemplaza al windows-workflow de codemagic.yaml (instance_type: windows_x2 requiere plan de
# pago en Codemagic y por eso nunca publicaba el .zip). Este job es gratis en GitHub Actions.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter config --enable-windows-desktop

      - run: flutter pub get

      - run: flutter build windows --release

      - name: Empaquetar build de Windows
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath anivault-windows.zip

      - name: Calcular tag desde pubspec.yaml
        id: tag
        shell: pwsh
        run: |
          $version = (Get-Content pubspec.yaml | Select-String '^version:').ToString() -replace 'version:\s*', '' -replace '\+.*', ''
          echo "tag=v$($version.Trim())" >> $env:GITHUB_OUTPUT

      - name: Verificar que la version es superior a la ultima publicada
        run: node tools/verify-release-version.mjs --repo ${{ github.repository }} --new "${{ steps.tag.outputs.tag }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: anivault-windows.zip
