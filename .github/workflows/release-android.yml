name: Release Android

# Compila y firma el APK en GitHub Actions (gratis), en vez de depender del
# android-workflow de Codemagic (minutos de build limitados en el plan free).
# Requiere estos secrets en el repo (ver keystore-secret/ local, nunca se sube;
# misma convencion de nombres que finanzas360/nexfit):
#   ANDROID_KEYSTORE_BASE64    -> base64 de keystore-secret/anivault-release.jks
#   ANDROID_KEYSTORE_PASSWORD  -> STORE_PASSWORD en anivault-keystore-credentials.txt
#   ANDROID_KEY_ALIAS          -> KEY_ALIAS en anivault-keystore-credentials.txt
#   ANDROID_KEY_PASSWORD       -> KEY_PASSWORD en anivault-keystore-credentials.txt
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar que el tag es superior al ultimo release publicado
        run: node tools/verify-release-version.mjs --repo ${{ github.repository }} --new "${{ github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable

      - name: Preparar firma de release
        run: |
          # grep -v descarta encabezados tipo "-----BEGIN...-----" si el base64
          # se genero con certutil u otra herramienta que los agrega; tr quita
          # saltos de linea/espacios que pudieran colarse al copiar el secret.
          printf '%s' "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" \
            | grep -v -- '-----' \
            | tr -d '\r\n ' \
            | base64 -d --ignore-garbage > android/app/anivault-release.jks
          cat > android/key.properties <<EOF
          storeFile=anivault-release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Verificar keystore (falla rapido si el secret esta mal)
        run: |
          keytool -list \
            -keystore android/app/anivault-release.jks \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -alias "${{ secrets.ANDROID_KEY_ALIAS }}"

      - run: flutter pub get

      - name: Derivar version del tag
        id: version
        run: echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - run: >
          flutter build apk --release
          --build-name=${{ steps.version.outputs.name }}
          --build-number=${{ github.run_number }}

      - name: Renombrar artefacto
        run: cp build/app/outputs/flutter-apk/app-release.apk anivault-android.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: anivault-android.apk
