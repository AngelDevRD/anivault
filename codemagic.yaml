workflows:
  # android-workflow removido: duplicaba el build/release del APK con
  # .github/workflows/release-android.yml (gratis en GitHub Actions) y ambos
  # subiendo el mismo asset al mismo tag de release generaba conflictos.
  # Ademas se detecto que este workflow nunca firmaba con la release key: el
  # build.gradle.kts no leia key.properties, asi que "release, firmado" en
  # realidad usaba las debug keys. Ya corregido en build.gradle.kts (ambos
  # sistemas de build ahora firman correctamente si key.properties existe).

  ios-workflow:
    name: iOS (IPA)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic # nombre de la integracion creada en Codemagic > Team > Integrations > App Store Connect (pendiente hasta configurar la cuenta Apple)
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    environment:
      groups:
        - portfolio_release # RELEASE_GH_TOKEN, WEBHOOK_SECRET
      ios_signing:
        distribution_type: app_store # cambiar a "ad_hoc" para pruebas fuera de TestFlight
        bundle_identifier: com.anivault.anivault
      vars:
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
      flutter: stable
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: Instalar dependencias
        script: flutter pub get
      - name: Instalar CocoaPods
        script: |
          find . -name "Podfile" -maxdepth 2 -execdir pod install \;
      - name: Configurar firma automatica (App Store Connect API key)
        script: |
          xcode-project use-profiles
      - name: Compilar IPA (release)
        script: |
          flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist
      - name: Notificar al portafolio (distribucion via TestFlight, sin asset descargable)
        script: |
          curl -sf --retry 3 --retry-delay 5 --retry-connrefused --retry-all-errors -X POST -H "Content-Type: application/json" \
            -d '{"workflowId":"ios-workflow","buildStatus":"success"}' \
            "https://portfolio-five-zeta-xf21p0a5se.vercel.app/api/orchestrator/webhook?owner=AngelDevRD&repo=anivault&secret=$WEBHOOK_SECRET"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - leybayesenia1975@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  # windows-workflow removido: instance_type windows_x2 requiere plan de pago en Codemagic
  # y nunca llegaba a publicar el asset. El build de Windows ahora corre gratis en
  # .github/workflows/release-windows.yml (GitHub Actions).
